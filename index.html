<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#10101c">
<title>Shobhit Rathaur Video Studio</title>

<style>
:root{
--bg:#0b0b13;
--panel:#151522;
--panel2:#1c1c2d;
--line:#303047;
--text:#f4f4ff;
--muted:#a7a7c0;
--pink:#ff4d9d;
--purple:#8b5cf6;
--cyan:#42d9ff;
--green:#42e6a4
}

*{box-sizing:border-box}

body{
margin:0;
background:radial-gradient(ellipse at top,#21143b 0,#0b0b13 50%);
color:var(--text);
font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif
}

button,input,select{font:inherit}

button{
cursor:pointer;
border:1px solid var(--line);
color:var(--text);
background:#24243a;
border-radius:11px;
padding:10px 13px;
transition:.18s
}

button:hover{
transform:translateY(-1px);
border-color:var(--pink);
background:#302542
}

button:disabled{
opacity:.45;
cursor:not-allowed;
transform:none
}

.primary{
background:linear-gradient(110deg,var(--pink),var(--purple));
border:0;
font-weight:800
}

.secondary{background:#202034}
.danger{color:#ff8cae}

.app{
max-width:1500px;
margin:auto;
padding:18px
}

.topbar{
display:flex;
align-items:center;
justify-content:space-between;
gap:12px;
padding:12px 4px 20px;
flex-wrap:wrap
}

.brand{
display:flex;
align-items:center;
gap:12px
}

.logo{
width:48px;
height:48px;
border-radius:15px;
background:linear-gradient(135deg,var(--pink),var(--purple),var(--cyan));
display:grid;
place-items:center;
font-size:24px;
box-shadow:0 8px 30px #8b5cf644
}

.brand h1{
font-size:clamp(19px,3vw,27px);
margin:0;
letter-spacing:-.5px
}

.brand p{
margin:4px 0 0;
color:var(--muted);
font-size:12px
}

.top-actions{
display:flex;
gap:8px;
flex-wrap:wrap
}

.badge{
color:var(--green);
font-size:12px;
border:1px solid #42e6a455;
padding:8px 10px;
border-radius:999px;
background:#42e6a410
}

.layout{
display:grid;
grid-template-columns:minmax(0,1.6fr) minmax(300px,.9fr);
gap:16px
}

.card{
background:linear-gradient(160deg,#191928f5,#11111cf5);
border:1px solid var(--line);
border-radius:18px;
overflow:hidden;
box-shadow:0 18px 55px #0003
}

.cardhead{
padding:14px 16px;
border-bottom:1px solid var(--line);
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.cardhead h2{
font-size:14px;
margin:0;
letter-spacing:.4px
}

.muted{
color:var(--muted);
font-size:12px
}

.preview-area{padding:16px}

.stage{
position:relative;
min-height:240px;
aspect-ratio:16/9;
background:linear-gradient(135deg,#151526,#090910);
border:1px solid #35354c;
border-radius:14px;
display:grid;
place-items:center;
overflow:hidden
}

.stage video,.stage img{
max-width:100%;
max-height:100%;
width:100%;
height:100%;
object-fit:contain;
position:absolute;
inset:0
}

.stage video{background:#050509}
.stage img{display:none}

.empty{
position:relative;
z-index:2;
text-align:center;
padding:22px;
color:var(--muted)
}

.empty .big{
font-size:46px;
margin-bottom:10px
}

.empty strong{
display:block;
color:white;
margin-bottom:6px
}

.stage.has-media .empty{display:none}

.overlay-text{
position:absolute;
z-index:4;
left:50%;
top:50%;
transform:translate(-50%,-50%);
width:90%;
text-align:center;
font-size:clamp(18px,4vw,38px);
font-weight:900;
text-shadow:0 3px 10px #000;
white-space:pre-wrap;
pointer-events:none
}

.font-impact{
font-family:Impact,"Arial Black",sans-serif;
letter-spacing:.5px;
text-transform:uppercase
}

.font-bebas{
font-family:"Arial Narrow",Impact,sans-serif;
letter-spacing:2px;
text-transform:uppercase
}

.font-rounded{
font-family:"Trebuchet MS",Arial,sans-serif;
letter-spacing:.3px
}

.font-serif{
font-family:Georgia,"Times New Roman",serif
}

.font-mono{
font-family:"Courier New",monospace;
letter-spacing:1px
}

.font-hand{
font-family:"Comic Sans MS","Segoe Print",cursive;
font-weight:600
}

.font-comic{
font-family:"Comic Sans MS",Impact,sans-serif;
letter-spacing:.5px
}

.font-condensed{
font-family:"Arial Narrow",Impact,sans-serif;
letter-spacing:-.5px;
text-transform:uppercase
}

.font-marker{
font-family:"Comic Sans MS","Segoe Print",cursive;
font-weight:900;
text-transform:uppercase
}

.font-georgia{
font-family:Georgia,serif;
letter-spacing:1px
}

.font-courier{
font-family:"Courier New",monospace
}

.watermark{
position:absolute;
right:12px;
bottom:10px;
z-index:5;
font-size:11px;
color:#ffffffb5;
text-shadow:0 1px 4px #000
}

.stage.glitch:after{
content:"";
position:absolute;
inset:0;
pointer-events:none;
background:repeating-linear-gradient(
0deg,transparent 0 6px,#ff4d9d19 7px 8px
);
mix-blend-mode:screen
}

.stage.vignette:before{
content:"";
position:absolute;
inset:0;
z-index:2;
pointer-events:none;
background:radial-gradient(ellipse,transparent 45%,#000a 100%)
}

.stage.scanlines:after{
content:"";
position:absolute;
inset:0;
z-index:3;
pointer-events:none;
background:repeating-linear-gradient(
0deg,#0000 0 3px,#0005 4px 5px
)
}

.transport{
display:flex;
gap:8px;
align-items:center;
flex-wrap:wrap;
margin-top:12px
}

.time{
font-variant-numeric:tabular-nums;
color:var(--muted);
font-size:12px
}

.range{
width:100%;
accent-color:var(--pink)
}

.timeline{
padding:14px 16px 16px;
border-top:1px solid var(--line)
}

.timeline-row{
display:grid;
grid-template-columns:75px 1fr 55px;
gap:10px;
align-items:center;
margin:10px 0
}

.timeline-row label{
font-size:12px;
color:var(--muted)
}

.timeline-row input{
width:100%;
accent-color:var(--cyan)
}

.section{
padding:15px 16px;
border-bottom:1px solid var(--line)
}

.section:last-child{border-bottom:0}

.section h3{
font-size:13px;
margin:0 0 12px
}

.tabs{
display:flex;
gap:7px;
overflow:auto;
padding:12px 14px;
border-bottom:1px solid var(--line)
}

.tab{
white-space:nowrap;
padding:8px 10px;
font-size:12px
}

.tab.active{
background:linear-gradient(110deg,#ff4d9d33,#8b5cf633);
border-color:var(--pink)
}

.controls{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px
}

.field{
display:flex;
flex-direction:column;
gap:6px;
min-width:0
}

.field.full{grid-column:1/-1}

.field label{
font-size:11px;
color:var(--muted)
}

.field input[type=text],
.field input[type=number],
.field select{
width:100%;
background:#0f0f1a;
color:var(--text);
border:1px solid var(--line);
border-radius:9px;
padding:10px;
min-width:0
}

.field input[type=range]{
width:100%;
accent-color:var(--pink)
}

.filter-grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:8px
}

.filter-btn{
padding:8px 5px;
font-size:11px;
display:flex;
flex-direction:column;
gap:5px;
align-items:center
}

.filter-btn .swatch{
width:100%;
height:34px;
border-radius:7px;
background:linear-gradient(135deg,#ff4d9d,#8b5cf6,#42d9ff)
}

.filter-btn.active{
border-color:var(--green);
box-shadow:inset 0 0 0 1px var(--green)
}

.filter-btn small{
color:var(--muted);
font-size:10px
}

.export-box{
padding:16px;
background:linear-gradient(135deg,#21132d,#141426)
}

.export-box h3{margin:0 0 8px}

.export-actions{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:12px
}

.notice{
font-size:11px;
color:var(--muted);
line-height:1.5;
margin-top:10px
}

.progress{
height:6px;
background:#303047;
border-radius:99px;
overflow:hidden;
margin-top:10px;
display:none
}

.progress span{
display:block;
height:100%;
width:0;
background:linear-gradient(90deg,var(--pink),var(--cyan))
}

.footer{
text-align:center;
color:#8585a5;
font-size:12px;
padding:22px 10px 8px
}

.footer b{color:#e5d9ff}
.hidden{display:none!important}
.mobile-note{display:none}

@media(max-width:900px){
.layout{grid-template-columns:1fr}
.stage{min-height:190px}
.mobile-note{display:block}
.app{padding:10px}
.topbar{padding-bottom:12px}
.filter-grid{grid-template-columns:repeat(3,1fr)}
}

@media(max-width:430px){
.timeline-row{grid-template-columns:58px 1fr 42px}
.controls{gap:8px}
.brand p{max-width:230px}
.top-actions button{padding:8px 9px;font-size:12px}
.filter-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
}
  </style>
